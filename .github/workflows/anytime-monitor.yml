name: Anytime-valid monitor (M479 / R489)

# A read-only daily reading of every live forward paper series through the M479 e-process monitor
# (lab/sequential.lane_monitor). An e-process is valid at every stopping time, so this job may read the
# journals on any day without inflating the type-I error - which the lanes' frozen fixed-look PREREGs
# cannot do. It writes no journal and places no order; it only prints the table into the run summary and
# comments on issue #7 when a series-cost cell newly rejects H0: mean <= 0 in the dependence-robust block
# mode. It replaces no lane's frozen verdict. See experiments/anytime_monitor_v1/FINDINGS.md.
on:
  schedule:
    - cron: '23 1 * * *'   # after the carry-paper runs (00-07 UTC) have written the prior day
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: anytime-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.repository == 'SaikiK12/T'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - name: Checkout reviewed default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-23
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install locked test environment
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Read the monitor over every live forward series
        run: .venv/bin/python scripts/forward_monitor.py --alpha 0.05 | tee monitor.txt
      - name: Publish the table to the run summary
        run: |
          {
            echo '## M479 anytime monitor (read-only)'
            echo 'Reject = H0: mean <= 0 rejected at alpha=0.05 in the dependence-robust block mode.'
            echo 'A `bet`-only crossing is reported but not treated as a rejection.'
            echo '```'
            cat monitor.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Alert issue #7 only on a new rejection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if grep -q 'REJECTS' monitor.txt; then
            body=$(printf '%s\n\n%s\n%s\n%s\n\n%s\n' \
              "M479 anytime monitor: a forward series-cost cell rejects H0: mean <= 0 in the block mode. This is a monitoring alert, not a gate-1 PASS and not a live-fill result; the owning lane's frozen PREREG still decides. Table:" \
              '```'; sed -n '1,60p' monitor.txt; printf '```'; \
              "_This comment was created automatically by an AI agent (OpenHands) on behalf of the repo owner._")
            gh issue comment 7 --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            echo "No block-mode rejection today; nothing posted to the room."
          fi
