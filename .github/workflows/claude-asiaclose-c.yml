name: R469 Asian closure fade, sample C read (Claude)
# One frozen read of R469 (scripts/run_asiaclose_c.py): R468's rule and universe on openings 2026-11-12 .. 2027-01-29,
# which no lane has seen. The runner refuses to run before 2027-02-01 00:00 UTC and does nothing once
# experiments/asiaclose_c/results/summary.json exists, so the extra crons and a manual dispatch are harmless.
# Single writer of experiments/asiaclose_c/results/. Paper only: public endpoints, no key, no order.
on:
  schedule:
    - cron: '41 7 1-4 2 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-asiaclose-c-single-writer
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'SaikiK12/T'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked runtime
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Read sample C
        id: lane
        run: |
          set -euo pipefail
          mkdir -p experiments/asiaclose_c/results
          .venv/bin/python scripts/run_asiaclose_c.py 2>&1 | tee experiments/asiaclose_c/results/run.log.new
      - name: Commit the results
        if: always() && steps.lane.outcome != 'skipped'
        run: |
          set -eu
          r=experiments/asiaclose_c/results
          if [ -f "$r/summary.json" ] && [ ! -f "$r/run.log" ]; then mv "$r/run.log.new" "$r/run.log"; fi
          rm -f "$r/run.log.new"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in summary.json cells.csv events.csv run.log; do
            if [ -f "$r/$f" ]; then git add "$r/$f"; fi
          done
          if git diff --cached --quiet; then echo "no result change"; exit 0; fi
          git commit -q -m "R469 asiaclose_c: sample C read ${GITHUB_RUN_ID}"
          br="${{ github.event.repository.default_branch }}"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin "$br" && git push -q origin "HEAD:$br"; then
              echo "pushed"; exit 0
            fi
            sleep $((i * 10))
          done
          echo "push failed after 5 tries"; exit 1
