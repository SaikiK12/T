name: Flow paper lanes (Claude)
# Single writer, from 2026-11-11, of the journals of the forward flow-book lanes R200 (Binance), R214 (one bar late),
# R215 (MEXC prices), R218 (X2 on MEXC), R220 (funding carry, R191 rule), R221 (sequential decision on R215/R218) and
# R225 (volatility target). They stopped on 2026-11-06 13:00 UTC with the container and had no other writer. Also the
# single writer of R448 (flow_hl_v1: the same signals on Hyperliquid's prices, scripts/run_flow_hl.py) from 2026-11-12,
# of R449's hedge tickets (jlphedge_v1: scripts/run_jlphedge.py, one per book and day, written the day before), and
# of R451 (flow_hlstock_v1: R200's signals on stock/commodity perps priced on Hyperliquid's xyz) from 2026-11-12.
# Hourly at :17, so R200 computes each hour within 60 minutes of its close (docs/GATES.md's strict on-time clock).
# GitHub drops or delays some scheduled runs (06:17 and 08:17 UTC on 2026-11-11 never fired; hours 02:00 and 05:00
# were computed 75 and 94 minutes after their close), so scheduled runs also fire at :32 and :47. A scheduled run
# ticks only if R200 has an hour not yet computed that closed 12 minutes ago (R200's own margin); otherwise it stops
# after the checkout and touches no API. GitHub then started no run of this file from 08:53 to 09:56 UTC, so
# claude-clock.yml dispatches it at :14 and :40 each hour with if_due (the same check); a plain dispatch always ticks.
# Each run computes every closed hour not yet journaled (Binance keeps 5-minute ratio history for 30 days), so a missed
# run is caught up by the next one; the frozen scripts are run unchanged, in their task order (lab/operations.py).
# Paper only: public market data, no key, no order. The local loop must not tick these lanes while this workflow owns
# them (docs/loop/STATE.md, 2026-11-11). data/live and data/mexc (gitignored caches) live in the Actions cache; if it is
# lost, the scripts refetch from the public APIs.
on:
  schedule:
    - cron: '17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      if_due:
        description: 'Tick only if R200 has a closed hour not yet computed (as a scheduled run)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: claude-flow-paper-single-writer
  cancel-in-progress: false
jobs:
  tick:
    if: github.repository == 'SaikiK12/T'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      LANES: >-
        flow72_fwd2 flow72_fwd3 mexc_fwd mexc_fwd_sq carry_fwd mexc_seq vt_fwd flow_hl_v1 jlphedge_v1 flow_hlstock_v1
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
      - name: Is a closed hour not yet computed by R200
        id: due
        run: |
          set -eu
          last=$(tail -n 1 experiments/flow72_fwd2/journal/ticks.csv | cut -d, -f1)
          want=$(( (($(date +%s) - 720) / 3600 - 1) * 3600 * 1000 ))  # open of the last hour closed 12 min ago, ms
          guarded=0
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.if_due }}" = "true" ]; then guarded=1; fi
          if [ $guarded -eq 1 ] && [ "$last" -ge "$want" ] 2>/dev/null; then
            echo "R200 is up to date (last hour $last); nothing to tick"; echo "due=0" >> "$GITHUB_OUTPUT"
          else
            echo "R200 last hour $last, last closed hour $want: tick"; echo "due=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.due.outputs.due == '1'
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked runtime
        if: steps.due.outputs.due == '1'
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Restore market-data caches
        if: steps.due.outputs.due == '1'
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data/live
            data/mexc
          key: flow-paper-data-${{ github.run_id }}
          restore-keys: flow-paper-data-
      - name: Mark the caches before the run
        if: steps.due.outputs.due == '1'
        run: mkdir -p data && touch data/.flow_paper_marker
      - name: Tick R200, R214, R215, R218, R220, R221, R225, R448, R449, R451
        id: tick
        if: steps.due.outputs.due == '1'
        run: |
          set -u
          echo "data cache: ${{ steps.restore.outputs.cache-matched-key || 'none (refetch from the APIs)' }}"
          fail=""
          run() {   # name, then script; a lane's failure skips only the lanes that read it
            name=$1; shift
            echo "::group::$name"
            start=$(date +%s)
            timeout 3000 .venv/bin/python "$@"; rc=$?
            echo "$name exit $rc after $(( $(date +%s) - start )) s"
            echo "::endgroup::"
            [ $rc -eq 0 ] || fail="$fail $name"
            return $rc
          }
          run R449 scripts/run_jlphedge.py --window forward || true    # DefiLlama and Hyperliquid only; reads no lane
          if run R200 scripts/forward_tick.py; then
            run R448 scripts/run_flow_hl.py --window forward || true
            if [ -f experiments/flow_hlstock_v1/PREREG.sha256 ]; then     # R451 runs once frozen
              run R451 scripts/run_flow_hlstock.py --window forward || true
            fi
            run R214 scripts/forward_delayed.py || true
            # R215 met the same 510 refusal (run 42980224484: RLC_USDT funding, no tickets) and writes nothing on a
            # failed fetch, so it gets R220's wrapper and attempts below. R218 fetches MEXC klines itself through
            # forward_mexc's client (run 42990781696: 510 on five klines, no tickets), so it gets the same; R221 and
            # R225 read R215's and R218's files only.
            r215=1
            for i in 1 2 3; do
              [ $i -gt 1 ] && { sleep 180; fail="${fail/ R215/}"; }
              run R215 scripts/run_paced_mexc.py scripts/forward_mexc.py && { r215=0; break; }
            done
            if [ $r215 -eq 0 ]; then
              for i in 1 2 3; do
                [ $i -gt 1 ] && { sleep 180; fail="${fail/ R218/}"; }
                if run R218 scripts/run_paced_mexc.py scripts/forward_mexc_sq.py; then
                  run R221 scripts/forward_seq.py || true
                  break
                fi
              done
              run R225 scripts/forward_vt.py || true
            fi
            # MEXC refuses bursts by IP (510) on shared runners: neither one 120 s wait (run 42933784241) nor four
            # attempts 3 minutes apart (run 42939724639) got through. scripts/run_paced_mexc.py runs the frozen script
            # unchanged with MEXC requests spaced 0.25 s and each 510 retried after 5, 15 and 45 s. Up to 3 attempts;
            # R220 writes nothing on a failed fetch.
            for i in 1 2 3; do
              [ $i -gt 1 ] && { sleep 180; fail="${fail/ R220/}"; }
              run R220 scripts/run_paced_mexc.py scripts/forward_carry.py && break
            done
          fi
          for l in $LANES; do
            last=$(tail -n 1 "experiments/$l/journal/tickets.csv" 2>/dev/null | cut -d, -f1-2)
            echo "$l: last ticket: $last"
          done
          echo "failed=${fail# }" >> "$GITHUB_OUTPUT"
      - name: Did any cache file change
        id: changed
        if: always()
        run: |
          n=$(find data/live data/mexc -newer data/.flow_paper_marker -type f 2>/dev/null | wc -l)
          echo "cache files written this run: $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - name: Save market-data caches
        if: always() && steps.changed.outputs.n != '0'
        uses: actions/cache/save@v4
        with:
          path: |
            data/live
            data/mexc
          key: flow-paper-data-${{ github.run_id }}
      - name: Commit journals
        if: always() && steps.tick.outcome != 'skipped'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for l in $LANES; do
            if [ -d "experiments/$l/journal" ]; then git add -A "experiments/$l/journal"; fi
          done
          git add -A experiments/mexc_seq/results     # R221 writes its looks and status there
          if git diff --cached --quiet; then echo "no journal change"; exit 0; fi
          git commit -q -m "Flow paper lanes: GitHub tick ${GITHUB_RUN_ID} (R200, R214-R225, R448, R449, R451)" \
            -m "failed: ${{ steps.tick.outputs.failed || 'none' }}"
          br="${{ github.event.repository.default_branch }}"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin "$br" && git push -q origin "HEAD:$br"; then echo "pushed"; exit 0; fi
            sleep $((i * 10))
          done
          echo "push failed after 5 tries"; exit 1
      - name: Fail the run when a lane failed
        if: steps.tick.outputs.failed != ''
        run: |
          echo "failed lanes: ${{ steps.tick.outputs.failed }}"
          exit 1
