name: R480 NATGAS roll carry, forward reads (Claude)
# The frozen forward reads of R480 (scripts/run_futroll.py --auto): short trade.xyz's NATGAS perp (decides; CL and
# BRENTOIL reported) hedged with the NYMEX contracts its oracle references, rolled on xyz's own schedule, from the
# business-day-10 mark of 2026-11-13. Contract bars and 1-hour perp candles come from the data branch
# claude/futroll-data (read only; written by claude-futroll-recorder.yml); 4-hour candles, funding and ^IRX are
# fetched inside each read. The futility read refuses to run before 2027-05-15 00:00 UTC and the final read before
# 2027-11-13 00:00 UTC; each does nothing once its results/<read>/summary.json exists, so the extra crons (also in
# 2026) and a manual dispatch are harmless. Single writer of experiments/futroll_fwd/results/futility and
# results/final. Paper only: public endpoints, no key, no order.
on:
  schedule:
    - cron: '47 7 15-18 5 *'
    - cron: '47 7 13-16 11 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-futroll-single-writer
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'SaikiK12/T'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked runtime
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Check out the recordings (read only)
        run: |
          set -eu
          if git fetch -q --depth 1 origin claude/futroll-data; then
            git worktree add -q --detach .futroll-data FETCH_HEAD
          else
            echo "no recordings: every contract will be missing and the read INCONCLUSIVE"; mkdir -p .futroll-data
          fi
      - name: Run the due reads
        id: lane
        run: |
          set -euo pipefail
          r=experiments/futroll_fwd/results
          mkdir -p "$r"
          for k in futility final; do if [ -f "$r/$k/summary.json" ]; then touch "$r/.had_$k"; fi; done
          .venv/bin/python scripts/run_futroll.py --auto --data .futroll-data 2>&1 | tee "$r/auto.log.new"
      - name: Commit the results
        if: always() && steps.lane.outcome != 'skipped'
        run: |
          set -eu
          r=experiments/futroll_fwd/results
          for k in futility final; do
            if [ -f "$r/$k/summary.json" ] && [ ! -f "$r/.had_$k" ] && [ -f "$r/auto.log.new" ]; then
              cp "$r/auto.log.new" "$r/$k/run.log"
            fi
            rm -f "$r/.had_$k"
          done
          rm -f "$r/auto.log.new"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for k in futility final; do
            if [ -f "$r/$k/summary.json" ]; then git add "$r/$k"; fi    # a failed read commits nothing
          done
          if git diff --cached --quiet; then echo "no result change"; exit 0; fi
          git commit -q -m "R480 futroll_fwd: forward read ${GITHUB_RUN_ID}"
          br="${{ github.event.repository.default_branch }}"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin "$br" && git push -q origin "HEAD:$br"; then
              echo "pushed"; exit 0
            fi
            sleep $((i * 10))
          done
          echo "push failed after 5 tries"; exit 1
