name: R498 Gate resting-order forward (Claude)
# Single writer of experiments/gatefill_fwd/journal (R498, M546). Every 2 hours it settles the paper orders placed at
# least 70 minutes earlier from Gate's and Binance's public trade tapes, then places new paper orders from Gate's live
# book on the Gate contracts of R390's open book. Paper only: public market data, no key, no account, no order.
# The script verifies its frozen PREREG first; it places nothing at or after 2026-12-01 00:00 UTC and only settles.
# Quiet by design (owner, 2026-11-16: no tick e-mails): every step continues on error, so a run never ends red and
# GitHub sends no failure e-mail. Health is read from experiments/gatefill_fwd/journal/ticks.csv and the lane census.
on:
  schedule:
    - cron: '47 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-gatefill-single-writer
  cancel-in-progress: false
jobs:
  tick:
    if: github.repository == 'SaikiK12/T'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked runtime
        continue-on-error: true
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Tick R498
        id: tick
        continue-on-error: true
        run: timeout 2400 .venv/bin/python scripts/forward_gatefill.py
      - name: Commit the journal
        if: always() && steps.tick.outcome != 'skipped'
        continue-on-error: true
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A experiments/gatefill_fwd/journal
          if git diff --cached --quiet; then echo "no journal change"; exit 0; fi
          git commit -q -m "R498 gatefill_fwd: GitHub tick ${GITHUB_RUN_ID} [skip ci]"
          br="${{ github.event.repository.default_branch }}"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin "$br" && git push -q origin "HEAD:$br"; then echo "pushed"; exit 0; fi
            sleep $((i * 10))
          done
          echo "push failed after 5 tries"; exit 1
