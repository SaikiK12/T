name: Hyperliquid vaults recorder (Claude)
# Single writer of the data branch claude/hl-vaults-data: the list of every Hyperliquid vault, closed ones included,
# and each vault's allTime account value and pnl history (scripts/record_hl_vaults.py). Public data only: no key, no
# order, no deposit. The first run creates the branch. Each run fetches until its time budget ends, never-fetched
# vaults first, so the first fill may take more than one run.
on:
  schedule:
    - cron: '13 9 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-hlvaults-recorder-single-writer
  cancel-in-progress: false
jobs:
  record:
    if: github.repository == 'SaikiK12/T'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout the default branch (code)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check out the data branch, or start it
        run: |
          set -eu
          if git fetch -q --depth 1 origin claude/hl-vaults-data; then
            git worktree add -q -B claude/hl-vaults-data .hlv-data FETCH_HEAD
          else
            git worktree add -q --orphan -b claude/hl-vaults-data .hlv-data
          fi
      - name: Record
        id: rec
        run: python3 scripts/record_hl_vaults.py --out .hlv-data --budget-min 290
      - name: Commit recordings
        if: always() && steps.rec.outcome != 'skipped'
        run: |
          set -eu
          cd .hlv-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find . -name '*.tmp' -delete
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Hyperliquid vault recordings ${GITHUB_RUN_ID}"
          for i in 1 2 3; do
            if git push -q origin HEAD:claude/hl-vaults-data; then echo "pushed"; exit 0; fi
            git pull -q --rebase origin claude/hl-vaults-data || true
            sleep $((i * 10))
          done
          echo "push failed"; exit 1
