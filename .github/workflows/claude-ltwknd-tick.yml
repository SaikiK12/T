name: R467 Lighter weekend tickets (Claude)
# Point-in-time paper tickets of R467 (scripts/run_ltwknd_fwd.py tick): at Sunday 19:00 New York (E) decide R465's
# weekend fade on Lighter US-stock perps from the hourly candles then available and walk Lighter's live order book for
# a $1k market order; at Sunday 22:00 (X1) walk it again on the other side. A run up to 70 minutes early sleeps to the
# instant. claude-clock.yml dispatches this workflow at 18:10 and 21:10 New York on Sundays; the crons cover both DST
# seasons (E is 23:00 or 00:00 UTC, X1 02:00 or 03:00 UTC) as a second path, and a run with nothing due exits at once.
# Single writer of experiments/ltwknd_fwd/journal/tickets.csv. Paper only: public endpoints, no key, no order.
on:
  schedule:
    - cron: '15,45 22,23 * * 0'
    - cron: '15,45 0,1,2 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-ltwknd-tick-single-writer
  cancel-in-progress: false
jobs:
  tick:
    if: github.repository == 'SaikiK12/T'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked runtime
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Take the due tickets
        id: lane
        run: |
          set -euo pipefail
          if [ ! -f experiments/ltwknd_fwd/PREREG.sha256 ]; then echo "R467 not frozen"; exit 0; fi
          .venv/bin/python scripts/run_ltwknd_fwd.py tick
      - name: Commit the tickets
        if: always() && steps.lane.outcome != 'skipped'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          f=experiments/ltwknd_fwd/journal/tickets.csv
          if [ -f "$f" ]; then git add "$f"; fi
          if git diff --cached --quiet; then echo "no ticket change"; exit 0; fi
          git commit -q -m "R467 ltwknd_fwd: tickets ${GITHUB_RUN_ID}"
          br="${{ github.event.repository.default_branch }}"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin "$br" && git push -q origin "HEAD:$br"; then
              echo "pushed"; exit 0
            fi
            sleep $((i * 10))
          done
          echo "push failed after 5 tries"; exit 1
