name: R459 oil weekend fade on Lighter (Claude)
# Daily scoring of R459 (scripts/run_oilwknd.py): R432's lead, a fade of the WTI and BRENTOIL weekend move held from
# just before the CME Sunday reopen to the Monday cash open, on Lighter's one-minute prices and hourly funding, at the
# book costs recorded on claude/xyz-books-data (lighter/). A weekend is scored at the first run at least 3 h after the
# Monday cash open; daily, so a missed run is caught the next day (Lighter keeps at least 20 days of one-minute bars).
# Single writer of experiments/oilwknd_fwd/journal/. Paper only: public endpoints, no key, no order.
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-oilwknd-single-writer
  cancel-in-progress: false
jobs:
  score:
    if: github.repository == 'SaikiK12/T'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
      - name: Checkout the book data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: claude/xyz-books-data
          path: .xyz-data
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked runtime
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Score the lane
        id: lane
        run: |
          set -euo pipefail
          if [ ! -f experiments/oilwknd_fwd/PREREG.sha256 ]; then echo "R459 not frozen"; exit 0; fi
          .venv/bin/python scripts/run_oilwknd.py --snapshots .xyz-data
      - name: Commit the journal
        if: always() && steps.lane.outcome != 'skipped'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d experiments/oilwknd_fwd/journal ]; then git add -A experiments/oilwknd_fwd/journal; fi
          if git diff --cached --quiet; then echo "no journal change"; exit 0; fi
          git commit -q -m "R459 oilwknd_fwd: GitHub tick ${GITHUB_RUN_ID}"
          br="${{ github.event.repository.default_branch }}"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin "$br" && git push -q origin "HEAD:$br"; then echo "pushed"; exit 0; fi
            sleep $((i * 10))
          done
          echo "push failed after 5 tries"; exit 1
