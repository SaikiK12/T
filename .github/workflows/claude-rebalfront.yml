name: R472 rebalancing front-run, frozen fetch and run (Claude)
# R472's frozen fetch (scripts/fetch_rebalfront.py: SPY, IEF, TLT from Yahoo and DTB3 from FRED) and its single frozen
# run (scripts/run_rebalfront.py), on a GitHub runner because FRED drops the frozen client's connection from the cloud
# container that froze the lane (2026-11-12). Dispatch only. It does nothing once
# experiments/rebalfront_v1/results/summary.json exists, so it is the single writer of that folder and of
# docs/provenance/rebalfront.json. Paper only: public endpoints, no key, no order.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-rebalfront-single-writer
  cancel-in-progress: false
jobs:
  run:
    if: github.repository == 'SaikiK12/T'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked runtime
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Fetch, record provenance and run once
        id: lane
        run: |
          set -euo pipefail
          r=experiments/rebalfront_v1/results
          if [ -f "$r/summary.json" ]; then echo "already run"; echo "done=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          .venv/bin/python -c "from lab import prereg; print(prereg.verify('experiments/rebalfront_v1/PREREG.md'))"
          .venv/bin/python scripts/fetch_rebalfront.py --start 2002-06-01 --end 2026-11-12
          .venv/bin/python scripts/data_provenance.py data/rebalfront \
            --source "query1.finance.yahoo.com/v8/finance/chart (SPY, IEF, TLT) and fred.stlouisfed.org (DTB3); public" \
            --script scripts/fetch_rebalfront.py
          mkdir -p "$r"
          .venv/bin/python scripts/run_rebalfront.py 2>&1 | tee /tmp/run.log
          cp /tmp/run.log "$r/run.log"
          echo "done=1" >> "$GITHUB_OUTPUT"
      - name: Commit the results
        if: steps.lane.outputs.done == '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/rebalfront_v1/results docs/provenance/rebalfront.json
          if git diff --cached --quiet; then echo "no result change"; exit 0; fi
          git commit -q -m "R472 rebalfront_v1: frozen fetch and run on a GitHub runner ${GITHUB_RUN_ID}"
          br="${{ github.event.repository.default_branch }}"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin "$br" && git push -q origin "HEAD:$br"; then
              echo "pushed"; exit 0
            fi
            sleep $((i * 10))
          done
          echo "push failed after 5 tries"; exit 1
