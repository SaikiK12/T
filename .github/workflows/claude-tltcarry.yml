name: R474 hedged TLT carry, forward reads (Claude)
# The frozen forward reads of R474 (scripts/run_tltcarry.py --auto): short xyz:TLT against the iShares $ Treasury
# Bond 20+yr UCITS ETF, marked daily from public data. The futility read refuses to run before 2027-02-13 00:00 UTC
# and the final read before 2027-05-15 00:00 UTC; each does nothing once its results/<read>/summary.json exists, so
# the extra crons and a manual dispatch are harmless. Single writer of experiments/tltcarry_fwd/results/futility and
# results/final. Paper only: public endpoints, no key, no order.
on:
  schedule:
    - cron: '23 6 13-16 2 *'
    - cron: '23 6 15-18 5 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-tltcarry-single-writer
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'SaikiK12/T'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked runtime
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Run the due reads
        id: lane
        run: |
          set -euo pipefail
          r=experiments/tltcarry_fwd/results
          mkdir -p "$r"
          for k in futility final; do if [ -f "$r/$k/summary.json" ]; then touch "$r/.had_$k"; fi; done
          .venv/bin/python scripts/run_tltcarry.py --auto 2>&1 | tee "$r/auto.log.new"
      - name: Commit the results
        if: always() && steps.lane.outcome != 'skipped'
        run: |
          set -eu
          r=experiments/tltcarry_fwd/results
          for k in futility final; do
            if [ -f "$r/$k/summary.json" ] && [ ! -f "$r/.had_$k" ] && [ -f "$r/auto.log.new" ]; then
              cp "$r/auto.log.new" "$r/$k/run.log"
            fi
            rm -f "$r/.had_$k"
          done
          rm -f "$r/auto.log.new"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for k in futility final; do
            for f in summary.json daily.csv weekly.csv run.log; do
              if [ -f "$r/$k/$f" ]; then git add "$r/$k/$f"; fi
            done
          done
          if git diff --cached --quiet; then echo "no result change"; exit 0; fi
          git commit -q -m "R474 tltcarry_fwd: forward read ${GITHUB_RUN_ID}"
          br="${{ github.event.repository.default_branch }}"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin "$br" && git push -q origin "HEAD:$br"; then
              echo "pushed"; exit 0
            fi
            sleep $((i * 10))
          done
          echo "push failed after 5 tries"; exit 1
