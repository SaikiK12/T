name: R457 US-open picks on Lighter and Hyperliquid (Claude)
# Daily scoring of R457 (scripts/run_usopen_dex.py): R371's US-open picks (experiments/usopen_fwd/journal/, written by
# claude-usopen.yml) traded on Lighter (book L, decides) and Hyperliquid (book H, reported) at each venue's one-minute
# prices and funding and at the book costs recorded on claude/xyz-books-data (lighter/, main/, books/, markets/). A day
# is scored at the first run at least 3 h after its 24:00 UTC exit; daily, because Hyperliquid serves about 3.5 days
# of one-minute bars. Single writer of experiments/usopen_dex_fwd/journal/. Paper only: public endpoints, no key, no
# order.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-usopen-dex-single-writer
  cancel-in-progress: false
jobs:
  score:
    if: github.repository == 'SaikiK12/T'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
      - name: Checkout the book data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: claude/xyz-books-data
          path: .xyz-data
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked runtime
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Score the lane
        id: lane
        run: |
          set -euo pipefail
          if [ ! -f experiments/usopen_dex_fwd/PREREG.sha256 ]; then echo "R457 not frozen"; exit 0; fi
          .venv/bin/python scripts/run_usopen_dex.py --snapshots .xyz-data
      - name: Commit the journal
        if: always() && steps.lane.outcome != 'skipped'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d experiments/usopen_dex_fwd/journal ]; then git add -A experiments/usopen_dex_fwd/journal; fi
          if git diff --cached --quiet; then echo "no journal change"; exit 0; fi
          git commit -q -m "R457 usopen_dex_fwd: GitHub tick ${GITHUB_RUN_ID}"
          br="${{ github.event.repository.default_branch }}"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin "$br" && git push -q origin "HEAD:$br"; then echo "pushed"; exit 0; fi
            sleep $((i * 10))
          done
          echo "push failed after 5 tries"; exit 1
