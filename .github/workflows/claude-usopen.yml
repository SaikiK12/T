name: R371 US-open paper lane (Claude)
# Single writer, from 2026-11-11, of experiments/usopen_fwd/journal/ (R371, scripts/forward_usopen.py). The lane decides
# at 10:00 New York each NYSE trading day and scores a ticket after its 24:00 UTC exit. The Claude container that ran
# the daemon is reclaimed while idle, which left most days since 2026-11-02 missed or unscored.
# Paper only: public endpoints, no key, no order.
on:
  schedule:
    - cron: '1,31 13,14 * * 1-5' # two runs fall within 65 min before 10:00 New York (winter 15:00 UTC, summer
                                 # 14:00 UTC): the earlier one runs the daemon, the later one is a backup when
                                 # GitHub delays a scheduled start
    - cron: '47 0 * * *'         # scoring pass after the 24:00 UTC exit
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-usopen-single-writer
  cancel-in-progress: false
jobs:
  lane:
    if: github.repository == 'SaikiK12/T'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked runtime
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Run the lane
        id: lane
        run: |
          set -u
          left=$(.venv/bin/python - <<'PY'
          import datetime as dt
          from zoneinfo import ZoneInfo
          ny = ZoneInfo("America/New_York")
          now = dt.datetime.now(dt.timezone.utc).astimezone(ny)
          d = now.replace(hour=10, minute=0, second=0, microsecond=0)
          m = (d - now).total_seconds() / 60
          print(int(m) + 1 if 0 < m <= 65 else -1)
          PY
          )
          if [ "$left" -gt 0 ]; then
            echo "10:00 New York in about $left min: daemon until 6 min after it"
            timeout $(( (left + 6) * 60 )) .venv/bin/python scripts/forward_usopen.py run || true
          else
            echo "10:00 New York is not within 65 min: one tick (scoring, missed-day log, status)"
          fi
          .venv/bin/python scripts/forward_usopen.py tick | tail -n 20
          tail -n 15 data/logs/usopen_fwd.log 2>/dev/null || true
      - name: Commit the journal
        if: always() && steps.lane.outcome != 'skipped'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A experiments/usopen_fwd/journal
          if git diff --cached --quiet; then echo "no journal change"; exit 0; fi
          git commit -q -m "R371 usopen_fwd: GitHub tick ${GITHUB_RUN_ID}"
          br="${{ github.event.repository.default_branch }}"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin "$br" && git push -q origin "HEAD:$br"; then echo "pushed"; exit 0; fi
            sleep $((i * 10))
          done
          echo "push failed after 5 tries"; exit 1
