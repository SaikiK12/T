name: OKX X-Perp lane reads (Claude)
# Weekly reads of R441 (scripts/run_xperp_carry.py) and R442 (scripts/run_xperp_stock_carry.py) on the recorded data
# branch claude/okx-xperp-data: a status read (no decision), and each lane's frozen 90- and 180-day decision once its
# look date has passed (--until the look date, written once to results/look90 or results/look180).
# Single writer of experiments/xperp_carry_v1/results and experiments/xperp_stock_v1/results. Paper only.
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-xperp-reads-single-writer
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'SaikiK12/T'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
      - name: Checkout the data branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: claude/okx-xperp-data
          path: .okx-data
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked runtime
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Read the lanes
        id: reads
        run: |
          set -u
          today=$(date -u +%F)
          fail=0
          for pair in "xperp_carry_v1 run_xperp_carry.py" "xperp_stock_v1 run_xperp_stock_carry.py"; do
            set -- $pair
            lane=$1; script=scripts/$2
            echo "== $lane status"
            .venv/bin/python "$script" --data .okx-data --window forward --status \
              --out "experiments/$lane/results/forward_status" | tail -n 12 || fail=1
            for look in "90 2027-02-08" "180 2027-05-09"; do
              set -- $look
              out="experiments/$lane/results/look$1"
              if [[ "$today" > "$2" && ! -f "$out/report.json" ]]; then
                echo "== $lane look $1 (until $2)"
                .venv/bin/python "$script" --data .okx-data --window forward --until "$2" --out "$out" \
                  | tail -n 5 || fail=1
              fi
            done
          done
          exit $fail
      - name: Commit the reads
        if: always() && steps.reads.outcome != 'skipped'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A experiments/xperp_carry_v1/results experiments/xperp_stock_v1/results
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "R441/R442 weekly reads ${GITHUB_RUN_ID}"
          br="${{ github.event.repository.default_branch }}"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin "$br" && git push -q origin "HEAD:$br"; then echo "pushed"; exit 0; fi
            sleep $((i * 10))
          done
          echo "push failed after 5 tries"; exit 1
