name: R482 xyz-vs-Lighter NATGAS pair, forward reads (Claude)
# The frozen forward reads of R482 (scripts/run_xvroll.py --auto): short trade.xyz's NATGAS perp and long Lighter's at
# equal notional (decides; WTI and BRENTOIL reported), from the 20:00 UTC mark of 2026-11-16. Each read fetches xyz
# funding and 1-hour candles (merged with the 1-hour candles R480's recorder keeps on claude/futroll-data, read only),
# Lighter 1-hour candles and funding, and ^IRX. The futility read refuses to run before 2027-05-15 00:00 UTC and the
# final read before 2027-11-13 00:00 UTC; each does nothing once its results/<read>/summary.json exists, so the extra
# crons and a manual dispatch are harmless. Single writer of experiments/xvroll_fwd/results/futility and
# results/final. Paper only: public endpoints, no key, no order.
on:
  schedule:
    - cron: '53 8 15-18 5 *'
    - cron: '53 8 13-16 11 *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-xvroll-single-writer
  cancel-in-progress: false
jobs:
  read:
    if: github.repository == 'SaikiK12/T'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked runtime
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Check out R480's recordings (read only)
        run: |
          set -eu
          if git fetch -q --depth 1 origin claude/futroll-data; then
            git worktree add -q --detach .futroll-data FETCH_HEAD
          else
            echo "no recordings: xyz 1-hour candles come from the venue only (its latest 5,000)"; mkdir -p .futroll-data
          fi
      - name: Run the due reads
        id: lane
        run: |
          set -euo pipefail
          r=experiments/xvroll_fwd/results
          mkdir -p "$r"
          for k in futility final; do if [ -f "$r/$k/summary.json" ]; then touch "$r/.had_$k"; fi; done
          .venv/bin/python scripts/run_xvroll.py --auto --data .futroll-data 2>&1 | tee "$r/auto.log.new"
      - name: Commit the results
        if: always() && steps.lane.outcome != 'skipped'
        run: |
          set -eu
          r=experiments/xvroll_fwd/results
          for k in futility final; do
            if [ -f "$r/$k/summary.json" ] && [ ! -f "$r/.had_$k" ] && [ -f "$r/auto.log.new" ]; then
              cp "$r/auto.log.new" "$r/$k/run.log"
            fi
            rm -f "$r/.had_$k"
          done
          rm -f "$r/auto.log.new"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for k in futility final; do
            if [ -f "$r/$k/summary.json" ]; then git add "$r/$k"; fi    # a failed read commits nothing
          done
          if git diff --cached --quiet; then echo "no result change"; exit 0; fi
          git commit -q -m "R482 xvroll_fwd: forward read ${GITHUB_RUN_ID}"
          br="${{ github.event.repository.default_branch }}"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin "$br" && git push -q origin "HEAD:$br"; then
              echo "pushed"; exit 0
            fi
            sleep $((i * 10))
          done
          echo "push failed after 5 tries"; exit 1
