name: R463 xyz weekend fade scoring (Claude)
# Daily scoring of R463 (scripts/run_xyzwknd_fwd.py score): R462's weekend fade of trade.xyz US-stock perps on fresh
# weekends. Measure A (decides) prices R462's rule at that day's fees and the $1k book costs recorded on
# claude/xyz-books-data (books/, markets/); measure B scores the tickets taken by claude-xyzwknd-tick.yml. A weekend is
# scored once, at the first run at least 3 h after Sunday 22:00 New York once the recorder has passed it by 90 min
# (or 48 h later regardless). Single writer of experiments/xyzwknd_fwd/journal/{a_trades,b_trades}.csv and
# status.json. Paper only: public endpoints, no key, no order.
on:
  schedule:
    - cron: '19 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-xyzwknd-score-single-writer
  cancel-in-progress: false
jobs:
  score:
    if: github.repository == 'SaikiK12/T'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 50
      - name: Checkout the book data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: claude/xyz-books-data
          path: .xyz-data
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked runtime
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Score the lane
        id: lane
        run: |
          set -euo pipefail
          if [ ! -f experiments/xyzwknd_fwd/PREREG.sha256 ]; then echo "R463 not frozen"; exit 0; fi
          .venv/bin/python scripts/run_xyzwknd_fwd.py score --snapshots .xyz-data
      - name: Commit the journal
        if: always() && steps.lane.outcome != 'skipped'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in a_trades.csv b_trades.csv status.json; do
            p="experiments/xyzwknd_fwd/journal/$f"
            if [ -f "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then echo "no journal change"; exit 0; fi
          git commit -q -m "R463 xyzwknd_fwd: GitHub tick ${GITHUB_RUN_ID}"
          br="${{ github.event.repository.default_branch }}"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash origin "$br" && git push -q origin "HEAD:$br"; then echo "pushed"; exit 0; fi
            sleep $((i * 10))
          done
          echo "push failed after 5 tries"; exit 1
