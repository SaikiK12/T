name: Scoped benchmark and paper runtime
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: write
concurrency:
  group: quant-runtime-single-writer
  cancel-in-progress: false
jobs:
  paper:
    if: >-
      github.repository == 'SaikiK12/T' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.number == 7 &&
        github.event.comment.user.login == github.repository_owner &&
        (github.event.comment.body == '/quant-quote-tick' || github.event.comment.body == '/quant-quote-migrate')))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - name: Checkout reviewed default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Checkout canonical state
        id: state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/quant-runtime-state
          path: .runtime-state
      - name: Admit only the active contract or explicit owner migration
        id: admission
        env:
          OWNER_MIGRATE: ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/quant-quote-migrate' }}
        run: |
          python3 - <<'PY'
          import json, os
          active = json.load(open('.runtime-state/manifest.json')).get('active_contract')
          enabled = active == 'R429' or (active == 'R428' and os.environ['OWNER_MIGRATE'] == 'true')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('enabled=' + str(enabled).lower() + '\n')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.admission.outputs.enabled == 'true'
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked runtime
        if: steps.admission.outputs.enabled == 'true'
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Restore and migrate without HTTP
        if: steps.admission.outputs.enabled == 'true'
        run: .venv/bin/python scripts/quant_runtime_v4.py migrate --state-dir .runtime-state --run-id "gha_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
      - name: Publish migration before preparing source work
        if: steps.admission.outputs.enabled == 'true'
        run: |
          set -eu
          cd .runtime-state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json state
          if ! git diff --cached --quiet; then
            git commit -m "Scoped benchmark contract migration ${GITHUB_RUN_ID}: no HTTP"
            git push origin HEAD:refs/heads/codex/quant-runtime-state
          fi
      - name: Prepare source hour without HTTP
        if: steps.admission.outputs.enabled == 'true'
        run: .venv/bin/python scripts/quant_runtime_v4.py prepare --state-dir .runtime-state --run-id "gha_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
      - name: Publish hour reservation before HTTP
        if: steps.admission.outputs.enabled == 'true'
        run: |
          set -eu
          cd .runtime-state
          git add manifest.json state
          if ! git diff --cached --quiet; then
            git commit -m "Reserve scoped benchmark paper runtime ${GITHUB_RUN_ID} before HTTP"
            git push origin HEAD:refs/heads/codex/quant-runtime-state
          fi
      - name: Run native capture and priority papers
        if: steps.admission.outputs.enabled == 'true'
        id: tick
        run: .venv/bin/python scripts/quant_runtime_v4.py run --state-dir .runtime-state --run-id "gha_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
      - name: Publish receipts including partial failures
        if: always() && steps.state.outcome == 'success' && steps.tick.outcome != 'skipped'
        run: |
          set -eu
          .venv/bin/python scripts/quant_runtime_v4.py snapshot --state-dir .runtime-state
          cd .runtime-state
          git add manifest.json state
          if ! git diff --cached --quiet; then
            git commit -m "Participant source and paper runtime ${GITHUB_RUN_ID}: native receipts and inherited spend"
            git push origin HEAD:refs/heads/codex/quant-runtime-state
          fi
