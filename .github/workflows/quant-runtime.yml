name: Paper lab runtime
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: write
concurrency:
  group: quant-runtime-single-writer
  cancel-in-progress: false
jobs:
  paper:
    if: >-
      github.repository == 'SaikiK12/T' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.number == 7 &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.body == '/quant-tick'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - name: Checkout reviewed default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Checkout canonical operational state
        id: state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/quant-runtime-state
          path: .runtime-state
      - name: Check the active immutable operational contract
        id: admission
        run: |
          python3 - <<'PY'
          import json, os
          active = json.load(open('.runtime-state/manifest.json')).get('active_contract') == 'R420'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('active=' + str(active).lower() + '\n')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.admission.outputs.active == 'true'
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install locked runtime
        if: steps.admission.outputs.active == 'true'
        run: |
          python -m pip install uv==0.12.23
          uv venv --python 3.12.14 .venv
          uv pip sync --require-hashes --python .venv/bin/python requirements-test.lock
      - name: Prepare the registered hour without market requests
        if: steps.admission.outputs.active == 'true'
        id: prepare
        run: .venv/bin/python scripts/quant_runtime.py prepare --state-dir .runtime-state --run-id "gha_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
      - name: Publish reservation before any source request
        if: steps.admission.outputs.active == 'true'
        run: |
          set -eu
          cd .runtime-state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json state
          if ! git diff --cached --quiet; then
            git commit -m "Reserve paper runtime ${GITHUB_RUN_ID} before HTTP"
            git push origin HEAD:refs/heads/codex/quant-runtime-state
          fi
      - name: Execute registered paper and capture tasks
        if: steps.admission.outputs.active == 'true'
        id: tick
        run: .venv/bin/python scripts/quant_runtime.py run --state-dir .runtime-state --run-id "gha_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
      - name: Publish state even after a partial task failure
        if: always() && steps.state.outcome == 'success' && steps.tick.outcome != 'skipped'
        run: |
          set -eu
          .venv/bin/python scripts/quant_runtime.py snapshot --state-dir .runtime-state
          cd .runtime-state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json state
          if ! git diff --cached --quiet; then
            git commit -m "Paper runtime ${GITHUB_RUN_ID}: source receipts and explicit blockers"
            git push origin HEAD:refs/heads/codex/quant-runtime-state
          fi
