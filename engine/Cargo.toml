[package]
name = "qx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow-array = "55"
arrow-cast = "55"
arrow-schema = "55"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
parquet = { version = "55", default-features = false, features = ["arrow", "lz4", "snap", "zstd"] }
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
