# R274 squeeze_v1: negative-funding onset shorts with a protective cover, Binance 2021-26 and MEXC 2025-26
# (experiments/squeeze_v1/PREREG.md).
name = "squeeze_v1"
events = "experiments/squeeze_v1/legs.csv"
filter = { window = "archive" }
venues = [
  { name = "binance", col = "perp", klines = "klines_1h", funding = "fundingRate" },
  { name = "mexc", col = "mexc", klines = "mexc_hist/klines_1h", vol = "vol", funding = "mexc_hist/funding" },
]
horizons = [24, 72, 168]
directions = ["short"]
lines = ["net"]
stops = [0.0, 0.10, 0.20, 0.35]
costs = [0.004, 0.008, 0.012]
min_clusters = 10
reps = 2000
seed = 274
alpha = 0.05
g3_min = 3
null_for = "rc_pass"
winsor = 0
max_bar_jump = 20
start = "2021-01-01"
end = "2026-09-30"
out = "experiments/squeeze_v1/results"
